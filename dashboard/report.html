<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Your InstitutionalOS Report | Frankly Inspired</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --navy: #11233D; --navy-deep: #0B1A2D;
  --gold: #B28E42; --gold-light: #CBA869; --gold-access: #8E7134; --gold-soft: #F3ECDC;
  --charcoal: #23282D; --muted: #55606B; --line: #E2E6EA; --bg-soft: #F3F5F7;
  --red: #B42828; --red-bg: #FBEAEA; --green: #1E7A4C; --green-bg: #E4F3EC;
  --font-heading: "Playfair Display", Georgia, serif;
  --font-body: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg-soft); color: var(--charcoal); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
h1, h2, h3 { font-family: var(--font-heading); color: var(--navy); font-weight: 600; line-height: 1.2; margin: 0 0 .5em; }
a { color: var(--gold-access); }
.wrap { max-width: 880px; margin: 0 auto; padding: 0 20px; }

.site-header { background: #fff; border-bottom: 1px solid var(--line); }
.site-header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 14px; padding-bottom: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-heading); font-weight: 600; font-size: 19px; color: var(--navy); text-decoration: none; }
.brand .mark { width: 26px; height: 26px; border-radius: 6px; background: var(--navy); color: var(--gold-light); display: flex; align-items: center; justify-content: center; font-size: 13px; font-family: var(--font-heading); }
.header-links { display: flex; align-items: center; gap: 18px; font-size: 14px; }
.header-links a { color: var(--charcoal); text-decoration: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; padding: 10px 18px; font-weight: 600; font-size: 14px; text-decoration: none; border: 1px solid transparent; cursor: pointer; font-family: var(--font-body); }
.btn-gold { background: var(--gold); color: var(--navy-deep) !important; }
.btn-ghost { background: #fff; border-color: var(--line); color: var(--navy) !important; }

.hero { background: linear-gradient(135deg, var(--navy), var(--navy-deep)); color: #fff; padding: 40px 0 44px; }
.eyebrow { text-transform: uppercase; letter-spacing: .14em; font-size: 12px; font-weight: 600; color: var(--gold-light); margin: 0 0 10px; }
.hero h1 { color: #fff; font-size: clamp(28px, 4.5vw, 40px); margin-bottom: 8px; }
.hero-meta { color: #C9D2DD; font-size: 14px; margin: 0; }
.hero-score { display: flex; align-items: center; gap: 22px; margin-top: 26px; flex-wrap: wrap; }
.ring { --p: 0; width: 112px; height: 112px; border-radius: 50%; background: conic-gradient(var(--gold-light) calc(var(--p) * 1%), rgba(255,255,255,.14) 0); display: grid; place-items: center; flex: none; }
.ring span { width: 90px; height: 90px; border-radius: 50%; background: var(--navy-deep); display: grid; place-items: center; font-family: var(--font-heading); font-size: 34px; font-weight: 700; color: #fff; }
.hero-score strong { font-size: 18px; display: block; }
.hero-score p { margin: 2px 0 0; color: #C9D2DD; font-size: 14px; max-width: 460px; }

main { padding: 28px 0 10px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 24px; margin-bottom: 18px; box-shadow: 0 1px 2px rgba(17,35,61,.04); }
.card h2 { font-size: 22px; }
.card .lead { color: var(--muted); margin: -4px 0 16px; font-size: 14px; }
.constraint { border-left: 4px solid var(--gold); }
.constraint .big { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 6px 0 12px; }
.constraint .big strong { font-family: var(--font-heading); font-size: 24px; color: var(--navy); }
.target { display: inline-flex; align-items: center; gap: 8px; background: var(--gold-soft); color: var(--gold-access); font-weight: 600; font-size: 13px; padding: 4px 12px; border-radius: 999px; }

.dim { display: grid; grid-template-columns: minmax(150px, 230px) 1fr 92px; gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.dim:last-child { border-bottom: 0; }
.dim .name { font-weight: 500; }
.dim .name small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
.track { position: relative; height: 10px; background: #EDEFF2; border-radius: 999px; }
.fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--navy); }
.fill.low { background: var(--red); }
.fill.mid { background: var(--gold); }
.fill.none { background: repeating-linear-gradient(45deg, #C9CFD6 0 6px, #DDE1E6 6px 12px); }
.tick { position: absolute; top: -4px; width: 2px; height: 18px; background: var(--gold-access); }
.dim .nums { text-align: right; font-variant-numeric: tabular-nums; }
.dim .nums b { font-size: 15px; }
.dim .nums small { display: block; color: var(--muted); font-size: 12px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 12px; }
.legend i { display: inline-block; width: 2px; height: 12px; background: var(--gold-access); vertical-align: middle; margin-right: 6px; }

.gates { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.gate { font-size: 13px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); }
.gate.open { background: var(--red-bg); border-color: #F1CACA; color: var(--red); }
.gate.met { background: var(--green-bg); border-color: #CBE6D7; color: var(--green); }

.chart svg { width: 100%; height: auto; display: block; }
.ladder { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 4px 0 14px; }
.rung { padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1px solid var(--line); color: var(--muted); }
.rung.done { background: var(--navy); color: #fff; border-color: var(--navy); }
.rung.next { background: var(--gold-soft); color: var(--gold-access); border-color: var(--gold-light); }
.steps { margin: 0; padding-left: 20px; }
.steps li { margin-bottom: 8px; }
.muted { color: var(--muted); font-size: 13px; }
.item { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.item:last-child { border-bottom: 0; }
.pill { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; align-self: center; }
.pill.red { background: var(--red-bg); color: var(--red); }
.pill.amber { background: var(--gold-soft); color: var(--gold-access); }
.pill.green { background: var(--green-bg); color: var(--green); }
.pill.grey { background: #EDEFF2; color: var(--muted); }

.tabs { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid var(--line); }
.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs button { font: inherit; font-size: 14px; font-weight: 600; color: var(--muted); background: none; border: none; border-bottom: 3px solid transparent; padding: 12px 14px; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--navy); border-bottom-color: var(--gold); }
.tabs button:focus-visible { outline: 2px solid var(--gold-access); outline-offset: -2px; }
.tab-panel[hidden] { display: none; }
@media print { .tabs { display: none; } .tab-panel[hidden] { display: block !important; } }
.table-wrap { overflow-x: auto; }
.ba-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.ba-table th, .ba-table td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #E2E6EA; vertical-align: top; }
.ba-table thead th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.ba-table tbody th { font-weight: 600; }
.ba-table td.chg.up { color: #1E6B45; font-weight: 700; } .ba-table td.chg.down { color: #B3402C; font-weight: 700; }
.board-doc { background: #fff; color: var(--navy); padding: 24px 0 48px; }
.board-doc .wrap { max-width: 820px; }
.board-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.board-head h1 { font-family: var(--font-heading); margin: 4px 0; font-size: 30px; }
.board-sec { border-top: 2px solid var(--navy); padding-top: 10px; margin-top: 22px; break-inside: avoid; }
.board-sec h2 { font-size: 17px; margin: 0 0 8px; }
.board-sec ul { margin: 0; padding-left: 20px; } .board-sec li { margin: 4px 0; }
.board-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 6px 0 10px; }
.board-kpis div { border: 1px solid #E2E6EA; border-radius: 8px; padding: 10px 12px; }
.board-kpis strong { display: block; font-family: var(--font-heading); font-size: 26px; }
.board-kpis span { font-size: 12.5px; color: var(--muted); }
.board-foot { margin-top: 26px; font-size: 12px; }
@media print { body.board-view > footer, body.board-view .site-header { display: none !important; } .board-doc { padding: 0; } .board-head h1 { font-size: 24px; } .board-sec { margin-top: 14px; } body { font-size: 12px; } }
.context dl { display: grid; grid-template-columns: minmax(130px, 200px) 1fr; gap: 6px 16px; margin: 0; font-size: 14px; }
.context dt { font-weight: 600; color: var(--navy); }
.context dd { margin: 0; }
@media (max-width: 560px) { .context dl { grid-template-columns: 1fr; gap: 0; } .context dd { margin-bottom: 8px; } }
.export { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 4px; }
.next-action { border-left: 5px solid var(--gold); }
.next-action .na-text { font-size: 18px; font-weight: 700; color: var(--navy); margin: 2px 0 6px; }
.progress { height: 8px; background: #EDEFF2; border-radius: 999px; overflow: hidden; margin: 8px 0 4px; }
.progress > span { display: block; height: 100%; background: var(--green); }
.plan-act { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.plan-act.done .t { text-decoration: line-through; color: var(--muted); }
.plan-act select { font: inherit; font-size: 13px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.checkin label { display: block; font-weight: 600; font-size: 13px; color: var(--navy); margin: 10px 0 4px; }
.checkin textarea { width: 100%; font: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; box-sizing: border-box; }
.checkin .ok { color: var(--green); font-weight: 700; }
.checkin .err { color: var(--red); }
.next-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.next-grid > div { border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.next-grid h3 { font-size: 17px; margin-bottom: 6px; }
.next-grid p { margin: 0 0 12px; font-size: 14px; color: var(--muted); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }

footer { color: var(--muted); font-size: 13px; text-align: center; padding: 18px 0 40px; }
.state { padding: 60px 0; text-align: center; }
.session { border-top: 4px solid var(--gold); }
.session p { margin: 0 0 12px; font-size: 14px; }
.error { color: var(--red); }

@media (max-width: 640px) {
  .dim { grid-template-columns: 1fr 70px; }
  .dim .track { grid-column: 1 / -1; grid-row: 2; }
  .header-links .hide-sm { display: none; }
}

/* Health Index dial (same mark as the website homepage) */
.hi-dial { margin: 0; width: 168px; flex: none; }
.hi-dial .dial-wrap { position: relative; }
.hi-dial svg { display: block; width: 100%; height: auto; overflow: visible; }
.hi-dial .dial-seg { cursor: pointer; outline: none; }
.hi-dial .dial-seg path { fill: none; stroke-linecap: round; }
.hi-dial .seg-bg { stroke: rgba(255,255,255,.16); stroke-width: 14; }
.hi-dial .seg-fill { stroke: var(--gold-light); stroke-width: 14; transition: stroke-width .2s ease, stroke-dashoffset 1.1s cubic-bezier(.65,0,.35,1) var(--d,0s); }
.hi-dial .dial-seg.weak .seg-fill { stroke: #E0735E; }
.hi-dial .dial-seg:hover .seg-fill, .hi-dial .dial-seg:focus-visible .seg-fill, .hi-dial .dial-seg.is-active .seg-fill { stroke-width: 19; }
.hi-dial .dial-seg:focus-visible .seg-bg { stroke: rgba(255,255,255,.35); }
.hi-dial .dial-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; text-align: center; padding: 0 22%; }
.hi-dial .dial-num { font-family: var(--font-heading); font-weight: 700; font-size: 40px; line-height: 1; color: #fff; }
.hi-dial .dial-label { margin-top: 4px; font-size: 10.5px; line-height: 1.2; letter-spacing: .05em; text-transform: uppercase; color: #C9D2DD; }
.hi-dial .dial-center.is-weak .dial-num { color: #F09B88; }
.hi-dial figcaption { margin-top: 6px; font-size: 12px; color: #C9D2DD; text-align: center; }
@media (prefers-reduced-motion: no-preference) { .hi-dial:not(.is-in) .seg-fill { stroke-dashoffset: 100; } }
@media print {
  .hi-dial .seg-bg { stroke: #E2E6EA; } .hi-dial .seg-fill { stroke: var(--gold); } .hi-dial .dial-seg.weak .seg-fill { stroke: #B3402C; }
  .hi-dial .dial-num { color: var(--navy); } .hi-dial .dial-label { color: var(--muted); }
}
@media print {
  .site-header .header-links, .no-print { display: none !important; }
  body { background: #fff; }
  .hero { background: none; color: var(--navy); padding: 10px 0; }
  .hero h1, .hero-score strong { color: var(--navy); }
  .hero-meta, .hero-score p { color: var(--muted); }
  .ring span { background: #fff; color: var(--navy); }
  .card { break-inside: avoid; box-shadow: none; }
}
.ev-row{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:16px;padding:14px 0;border-top:1px solid #e5e8ec}
.ev-row:first-of-type{border-top:0}
.ev-dim b{display:block;font-size:.95rem}.ev-dim small{color:#6b7480}
.ev-body p{margin:.35rem 0}.ev-body a{font-size:.9rem}
.ev-tag{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px}
.ev-ok{background:#e5f4e4;color:#1e6b2c}.ev-note{background:#f9eeda;color:#7a5410}.ev-none{background:#fbebeb;color:#9b2c2c}
.ev-log{list-style:none;padding:0;margin:0}.ev-log li{padding:8px 0;border-top:1px solid #e5e8ec}.ev-log li:first-child{border-top:0}
@media (max-width:600px){.ev-row{grid-template-columns:1fr;gap:4px}}
.demo-bar{background:#f9eeda;color:#5c3f0b;text-align:center;font-size:.9rem;padding:10px 16px;border-bottom:1px solid #ecd9b0}.demo-bar a{color:#5c3f0b;font-weight:600}
</style>

<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="https://franklyinspired.associates" data-org-link="website"><span class="mark">F</span> <span data-org="shortName">Frankly Inspired</span></a>
    <nav class="header-links">
      <a class="hide-sm" href="https://franklyinspired.associates/health-index">Your Health Index</a>
      <a class="hide-sm" href="https://franklyinspired.associates/consulting">Consulting</a>
      <a class="btn btn-gold" href="https://calendly.com/fparham/30min" data-org-link="booking" target="_blank" rel="noopener">Talk with&nbsp;<span data-org="leader.firstName">Franklin</span></a>
    </nav>
  </div>
</header>

<div id="app"><div class="wrap state"><p class="muted">Loading your report&hellip;</p></div></div>

<footer>
  <div class="wrap">
    InstitutionalOS is the diagnostic system of <a href="https://franklyinspired.associates" data-org-link="website" data-org="legalName">Frankly Inspired and Associates, LLC</a>.
    <a href="https://franklyinspired.associates/methodology">How scoring works</a> &middot; <a href="https://franklyinspired.associates/privacy">Privacy</a>
  </div>
</footer>

<script>
// The client page for one organization, opened from a private share link
// (report.html?token=...). Read-only: no login, no internal notes.
const PRIMARY_API = 'https://grantpass-backend.onrender.com';
const FALLBACK_API = 'https://grantpass-backend-600997839134.us-central1.run.app';
const CALENDLY = 'https://calendly.com/fparham/30min';
const SITE = 'https://franklyinspired.associates';
const STAGE_NAMES = { BUILD: 'Build', FUND: 'Fund', SUSTAIN: 'Sustain' };
const DIM_KEYS = {
  'Strategy and Positioning': 'strategy', 'Program and Impact Evidence': 'program',
  'Revenue and Financial Health': 'financial', 'Leadership and Organizational Capacity': 'leadership',
  'Operations and Infrastructure': 'operations', 'Partnerships and Ecosystem': 'partnerships',
  'Governance and Risk': 'governance',
};
const KEY_NAMES = Object.fromEntries(Object.entries(DIM_KEYS).map(([n, k]) => [k, n]));
const SEAL_LEVELS = ['Bronze', 'Silver', 'Gold', 'Platinum'];

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r0 = (n) => Math.round(Number(n) || 0);
const fmtDate = (d) => new Date(String(d).slice(0, 10) + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });

let API_BASE = '';
const DEMO_MODE = () => new URLSearchParams(location.search).get('demo') === 'sample';
let PORTAL_TOKEN = '';
async function fetchReport(token, client) {
  if (DEMO_MODE()) { const r = await fetch('sample-portal.json', { cache: 'no-store' }); if (!r.ok) throw new Error('The sample workspace isn\u2019t available right now.'); return r.json(); }
  const params = new URLSearchParams(location.search);
  const bases = [params.get('api'), PRIMARY_API, FALLBACK_API]
    .filter((b) => b && /^(https:\/\/[\w.-]+|http:\/\/(localhost|127\.0\.0\.1))(:\d+)?$/.test(b.replace(/\/+$/, '')))
    .map((b) => b.replace(/\/+$/, ''));
  let lastError = 'We couldn’t load this report.';
  for (const base of [...new Set(bases)]) {
    try {
      const res = await fetch(base + (client ? '/public/portal/' : '/public/report/') + encodeURIComponent(token));
      const data = await res.json().catch(() => ({}));
      if (res.ok) { API_BASE = base; return data; }
      lastError = res.status === 404 ? 'This report link isn’t valid anymore. Ask Franklin for a fresh one.' : (data.error || lastError);
    } catch (e) { /* try the next address */ }
  }
  throw new Error(lastError);
}

// The Health Index dial: the same seven-segment mark as the website's homepage,
// with this organization's real scores. Each segment fills to its score; the
// binding constraint (lowest scored area) is red. Hover, tap, or tab through
// the segments to read each one; the center returns to the overall score.
const DIAL_SHORT = { 'Strategy and Positioning': 'Direction', 'Program and Impact Evidence': 'Proof of results', 'Revenue and Financial Health': 'Revenue', 'Leadership and Organizational Capacity': 'Leadership', 'Operations and Infrastructure': 'Operations', 'Partnerships and Ecosystem': 'Partnerships', 'Governance and Risk': 'Governance' };
function dialHtml(r) {
  const dims = (r.dimensions || []).slice(0, 12);
  const overall = r0(r.overall);
  if (!dims.length) return `<div class="ring" style="--p:${overall}"><span>${overall}</span></div>`;
  const scored = dims.filter((d) => !/neutral default/i.test(d.note || ''));
  const weak = (scored.length ? scored : dims).slice().sort((a, b) => a.score - b.score)[0];
  const pt = (deg, rad = 84) => { const a = ((deg - 90) * Math.PI) / 180; return `${(100 + rad * Math.cos(a)).toFixed(2)},${(100 + rad * Math.sin(a)).toFixed(2)}`; };
  const arc = (from, to) => `M${pt(from)} A84,84 0 ${to - from > 180 ? 1 : 0} 1 ${pt(to)}`;
  const span = 360 / dims.length, gap = dims.length > 1 ? 7 : 0;
  const segs = dims.map((d, i) => {
    const noData = /neutral default/i.test(d.note || '');
    const a0 = i * span + gap / 2, a1 = (i + 1) * span - gap / 2;
    const name = DIAL_SHORT[d.name] || d.name, score = noData ? 0 : Math.max(0, Math.min(100, r0(d.score)));
    return `<g class="dial-seg${d === weak && !noData ? ' weak' : ''}${noData ? ' nodata' : ''}" tabindex="0" role="img" aria-label="${esc(d.name)}: ${noData ? 'not yet scored' : score + ' of 100'}" data-name="${esc(name)}" data-score="${noData ? '–' : score}">
      <path class="seg-bg" d="${arc(a0, a1)}"/><path class="seg-fill" d="${arc(a0, a1)}" pathLength="100" style="stroke-dasharray:${score} 100;--d:${(i * 0.08).toFixed(2)}s"/></g>`;
  }).join('');
  return `<figure class="hi-dial" data-dial>
    <div class="dial-wrap"><svg viewBox="0 0 200 200" role="group" aria-label="Health Index ${overall} of 100. ${esc(weak.name)} is the binding constraint.">${segs}</svg>
      <div class="dial-center" aria-hidden="true"><span class="dial-num" data-dial-num data-avg="${overall}">${overall}</span><span class="dial-label" data-dial-label>Health Index</span></div></div>
    <figcaption class="no-print">Tap a segment to see each area</figcaption></figure>`;
}
function wireDial() {
  document.querySelectorAll('[data-dial]').forEach((dial) => {
    const num = dial.querySelector('[data-dial-num]'), label = dial.querySelector('[data-dial-label]'), center = dial.querySelector('.dial-center');
    const segs = Array.from(dial.querySelectorAll('.dial-seg'));
    const reset = () => { num.textContent = num.dataset.avg; label.textContent = 'Health Index'; center.classList.remove('is-weak'); segs.forEach((g) => g.classList.remove('is-active')); };
    const show = (g) => { segs.forEach((x) => x.classList.toggle('is-active', x === g)); num.textContent = g.dataset.score; label.textContent = g.dataset.name; center.classList.toggle('is-weak', g.classList.contains('weak')); };
    segs.forEach((g) => { g.addEventListener('mouseenter', () => show(g)); g.addEventListener('focus', () => show(g)); g.addEventListener('click', () => show(g)); g.addEventListener('blur', reset); });
    dial.addEventListener('mouseleave', reset);
    requestAnimationFrame(() => requestAnimationFrame(() => dial.classList.add('is-in')));
  });
}

// Evidence on file: what backs each score, verified when a source is
// attached, plus the dated log of evidence the plan has produced.
function evidenceHtml(ev, r) {
  if (!ev) return '';
  const dims = (r && r.dimensions) || [];
  const rows = dims.map((d) => {
    const e = ev.dimensions[DIM_KEYS[d.name]] || null;
    const src = e && /^https:\/\//.test(e.source || '') ? e.source : '';
    const tag = !e || !e.note ? '<span class="ev-tag ev-none">No evidence on file</span>' : src ? '<span class="ev-tag ev-ok">Verified, source attached</span>' : '<span class="ev-tag ev-note">Noted</span>';
    return `<div class="ev-row"><div class="ev-dim"><b>${esc(d.name)}</b><small>${/neutral default/i.test(d.note || '') ? 'Not yet scored' : 'Score ' + r0(d.score)}</small></div>
      <div class="ev-body">${tag}${e && e.note ? `<p>${esc(e.note)}</p>` : '<p class="muted">Until evidence is on file, this score rests on assumptions.</p>'}${src ? `<a href="${esc(src)}" target="_blank" rel="noopener">Open the source</a>` : ''}</div></div>`;
  }).join('');
  const log = (ev.log || []).map((x) => `<li><span class="muted">${x.date ? fmtDate(x.date) : ''}</span> ${esc(x.text)} <small class="muted">${esc(x.from)}</small></li>`).join('');
  const onFile = dims.filter((d) => { const e = ev.dimensions[DIM_KEYS[d.name]]; return e && e.note; }).length;
  return `<section class="card"><h2>Evidence on file</h2><p class="lead">Claims can't outrun evidence: each score is backed by what's on file. ${onFile} of ${dims.length} areas have evidence${ev.updatedAt ? ', last updated ' + fmtDate(ev.updatedAt) : ''}.</p>${rows}</section>` +
    (log ? `<section class="card"><h2>Evidence log</h2><p class="lead">What the 90-day plan has produced, newest first.</p><ul class="ev-log">${log}</ul></section>` : '');
}

function dimsHtml(r) {
  const dims = r.dimensions || [];
  const rows = dims.map((d) => {
    const noData = /neutral default/i.test(d.note || '');
    const cls = noData ? 'none' : d.score < 55 ? 'low' : d.score < 75 ? 'mid' : '';
    return `<div class="dim">
      <div class="name">${esc(d.name)}<small>${noData ? 'Not yet scored' : 'Weight ' + r0(d.weight) + '%'}</small></div>
      <div class="track" role="img" aria-label="${esc(d.name)}: ${r0(d.score)}, target ${r0(d.liftTarget)}">

      </div>
      <div class="nums">${noData ? '<b>&ndash;</b><small>placeholder 50</small>' : `<b>${r0(d.score)}</b><small>target ${r0(d.liftTarget)}</small>`}</div>

  }).join('');
  const gate = r.hardGate || {};

  </section>`;
}

function historyHtml(history) {
  if (!history || history.length < 2) {
    return `<section class="card"><h2>Your progress</h2><p class="muted" style="margin:0">Your score history starts here. Each time your diagnostic is updated, this chart shows how far you've moved.</p></section>`;
  }
  const W = Math.max(300, Math.min(780, (document.querySelector('.wrap')?.clientWidth || 680) - 50)), H = 190, P = 28;
  const xs = (i) => P + (i * (W - 2 * P)) / (history.length - 1);
  const ys = (v) => H - P - (v / 100) * (H - 2 * P);
  const pts = history.map((h, i) => `${xs(i).toFixed(1)},${ys(h.overall).toFixed(1)}`).join(' ');
  const first = history[0], last = history[history.length - 1];
  const delta = r0(last.overall - first.overall);
  const grid = [25, 50, 75].map((v) => `<line x1="${P}" x2="${W - P}" y1="${ys(v)}" y2="${ys(v)}" stroke="#E2E6EA"/><text x="${P - 6}" y="${ys(v) + 4}" font-size="10" text-anchor="end" fill="#55606B">${v}</text>`).join('');
  const dots = history.map((h, i) => `<circle cx="${xs(i)}" cy="${ys(h.overall)}" r="4" fill="#11233D"><title>${esc(fmtDate(h.date))}: ${r0(h.overall)}</title></circle>`).join('');
  return `<section class="card chart">
    <h2>Your progress</h2>
    <p class="lead">${delta >= 0 ? 'Up' : 'Down'} ${Math.abs(delta)} point${Math.abs(delta) === 1 ? '' : 's'} since ${esc(fmtDate(first.date))} (${r0(first.overall)} &rarr; ${r0(last.overall)}).</p>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Overall score over time">${grid}
      <polyline points="${pts}" fill="none" stroke="#B28E42" stroke-width="2.5" stroke-linejoin="round"/>${dots}
      <text x="${P}" y="${H - 6}" font-size="11" fill="#55606B">${esc(fmtDate(first.date))}</text>
      <text x="${W - P}" y="${H - 6}" font-size="11" fill="#55606B" text-anchor="end">${esc(fmtDate(last.date))}</text>
    </svg>
  </section>`;
}

// Before and after: the score at the Diagnostic next to today's, per dimension.
function comparisonHtml(c) {
  if (!c || !c.dimensions || !c.dimensions.length) return '';

    <h2>Before and after</h2>
    <p class="lead">${esc(c.baselineLabel)} (${esc(fmtDate(c.baselineDate))}) compared with today.${c.overallChange !== null ? ` Overall: ${r0(c.overallBefore)} &rarr; ${r0(c.overallAfter)} (${sign(r0(c.overallAfter) - r0(c.overallBefore))}).` : ''}</p>
    <div class="table-wrap"><table class="ba-table">

function complianceHtml(items) {
  if (!items || !items.length) return '';
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const rows = items.map((it) => {
    let pill = ['green', 'Upcoming'];
    if (it.status === 'done') pill = ['green', 'Done'];
    else if (!it.due_date) pill = ['amber', 'No date'];
    else {
      const days = Math.round((new Date(it.due_date + 'T00:00:00') - today) / 86400000);
      if (days < 0) pill = ['red', 'Overdue']; else if (days <= 30) pill = ['amber', 'Due soon'];
    }
    return `<div class="item"><div><strong${it.status === 'done' ? ' style="text-decoration:line-through;color:var(--muted)"' : ''}>${esc(it.title)}</strong>
      <div class="muted">${it.category ? esc(it.category) + ' &middot; ' : ''}${it.due_date ? esc(fmtDate(it.due_date)) : 'No due date'}</div></div>
      <span class="pill ${pill[0]}">${pill[1]}</span></div>`;
  }).join('');
  return `<section class="card"><h2>Compliance calendar</h2><p class="lead">Filings and renewals we're tracking with you.</p>${rows}</section>`;
}

    <h3>Your next action</h3>
    <p class="na-text">${esc(st.nextAction.text)}</p>
    ${st.startDate ? '<p class="no-print" style="margin:0 0 6px"><a href="#plan">Open your 90-day plan &rarr;</a></p>' : ''}
    ${st.actionsTotal ? `<div class="progress" aria-hidden="true"><span style="width:${pct}%"></span></div><p class="muted" style="margin:0">${st.actionsDone} of ${st.actionsTotal} plan actions done${st.actionsBlocked ? ` &middot; ${st.actionsBlocked} blocked` : ''}${st.review90On ? ` &middot; 90-day review ${esc(fmtDate(st.review90On))}` : ''}${st.reassessOn ? ` &middot; reassessment ${esc(fmtDate(st.reassessOn))}` : ''}</p>` : ''}
  </section>`;
}
function contextHtml(p) {
  const r = (p && p.record) || {};
  const rows = [['The decision ahead', r.decisionAtStake ? r.decisionAtStake + (r.decisionDate ? ' (by ' + fmtDate(r.decisionDate) + ')' : '') : ''],
    ['The result you want', r.desiredResult], ['Who you serve', r.peopleServed], ['Your mission', r.mission]].filter(x => x[1]);
  if (!rows.length) return '';
  return `<section class="card context"><h2>Why we're doing this</h2><dl>${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></section>`;
}
let PLAN_CACHE = null, ORG_NAME = '';
function downloadFile(name, type, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function icsEscape(t) { return String(t || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
function planIcs() {
  const imp = PLAN_CACHE || {}, st = imp.status || {};
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const ev = [];
  const day = (iso, summary, desc, uid) => {
    const d = iso.slice(0, 10).replace(/-/g, '');
    const next = new Date(iso.slice(0, 10) + 'T12:00:00Z'); next.setUTCDate(next.getUTCDate() + 1);
    ev.push(['BEGIN:VEVENT', 'UID:' + uid + '@franklyinspired.associates', 'DTSTAMP:' + stamp, 'DTSTART;VALUE=DATE:' + d,
      'DTEND;VALUE=DATE:' + next.toISOString().slice(0, 10).replace(/-/g, ''), 'SUMMARY:' + icsEscape(summary), 'DESCRIPTION:' + icsEscape(desc), 'END:VEVENT'].join('\r\n'));
  };
  (imp.actions || []).forEach(a => { if (a.dueDate && a.status !== 'done') day(a.dueDate, 'Due: ' + a.title, [a.owner ? 'Owner: ' + a.owner : '', a.doneEvidence ? 'Done when: ' + a.doneEvidence : '', location.href].filter(Boolean).join('\n'), 'ios-action-' + a.id); });
  if (st.review90On && !st.review90Done) day(st.review90On, '90-day review: ' + ORG_NAME, 'Did the actions happen, are the early signs moving, does the diagnosis still hold?\n' + location.href, 'ios-review90-' + st.review90On);
  if (st.reassessOn && !st.reassessDone) day(st.reassessOn, 'Six-month reassessment: ' + ORG_NAME, location.href, 'ios-reassess-' + st.reassessOn);
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Frankly Inspired//InstitutionalOS//EN', 'CALSCALE:GREGORIAN', ...ev, 'END:VCALENDAR'].join('\r\n') + '\r\n';
}
function planCsv() {
  const q = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const rows = [['Action', 'Owner', 'Due', 'Status', 'Done when', 'Note']].concat((PLAN_CACHE && PLAN_CACHE.actions || []).map(a => [a.title, a.owner, a.dueDate, ACT_LABELS[a.status] || a.status, a.doneEvidence, a.note]));
  return '\ufeff' + rows.map(r => r.map(q).join(',')).join('\r\n') + '\r\n';
}
document.addEventListener('click', (e) => {
  if (e.target.id === 'exportIcs') downloadFile('90-day-plan.ics', 'text/calendar', planIcs());
  if (e.target.id === 'exportCsv') downloadFile('90-day-plan.csv', 'text/csv', planCsv());
});

function planHtml(p) {
  const imp = (p && p.improvement) || {};
  PLAN_CACHE = imp;
  const plan = imp.plan || {}, acts = imp.actions || [], revs = imp.reviews || [];
  if (!plan.target && !acts.length) return '<section class="card" id="plan"><h2>Your 90-Day Improvement Plan</h2><p class="muted" style="margin:0">Your plan appears here after the readout: one target, a few actions with owners and dates, and a 15-minute weekly check-in.</p></section>';
  const actRows = acts.map((a) => `<div class="plan-act ${a.status === 'done' ? 'done' : ''}" data-id="${a.id}">
      <div><div class="t"><strong>${esc(a.title)}</strong></div>
        <div class="muted">${[a.owner, a.dueDate ? 'due ' + fmtDate(a.dueDate) : ''].filter(Boolean).map(esc).join(' &middot; ')}</div>
        ${a.doneEvidence ? `<div class="muted">Done when: ${esc(a.doneEvidence)}</div>` : ''}
        ${a.note ? `<div class="muted">Note: ${esc(a.note)}</div>` : ''}</div>
      <select class="act-status no-print" aria-label="Status of ${esc(a.title)}">${Object.keys(ACT_LABELS).map((k) => `<option value="${k}"${a.status === k ? ' selected' : ''}>${ACT_LABELS[k]}</option>`).join('')}</select>
    </div>`).join('');
  const recent = revs.slice(0, 4).map((r) => `<div class="item"><div><strong>${esc(REV_LABELS[r.kind] || r.kind)} &middot; ${esc(fmtDate(r.reviewDate))}</strong>
      ${[['Done', r.completed], ['Blocked', r.blocked], ['Decision needed', r.decisionNeeded], ['Next', r.nextSteps]].filter((x) => x[1]).map((x) => `<div><span class="muted">${x[0]}:</span> ${esc(x[1])}</div>`).join('')}</div></div>`).join('');
  return `<section class="card" id="plan">
    <h2>Your 90-Day Improvement Plan</h2>
    ${plan.target ? `<p class="lead"><strong>Target:</strong> ${esc(plan.target)}${plan.baseline ? `<br><strong>Today:</strong> ${esc(plan.baseline)}` : ''}${plan.leadingSigns ? `<br><strong>Early signs it's working:</strong> ${esc(plan.leadingSigns)}` : ''}</p>` : ''}
    ${actRows || '<p class="muted">Actions will appear here once we agree on them.</p>'}
    ${acts.length ? `<div class="export no-print"><button class="btn btn-ghost" type="button" id="exportIcs">Add due dates to my calendar</button><button class="btn btn-ghost" type="button" id="exportCsv">Download as a spreadsheet</button></div>` : ''}
    <p class="muted no-print" id="actMsg" style="min-height:1em"></p>
    <div class="checkin no-print">
      <h3 style="margin-top:14px">Weekly check-in (15 minutes)</h3>
      <p class="muted" style="margin:0">Answer what applies. Franklin sees it right away.</p>
      <label for="ciDone">What got done this week?</label><textarea id="ciDone" rows="2"></textarea>
      <label for="ciBlocked">What's blocked?</label><textarea id="ciBlocked" rows="1"></textarea>
      <label for="ciEvidence">Evidence added (a document, a decision, a number)</label><textarea id="ciEvidence" rows="1"></textarea>
      <label for="ciDecision">What decision do you need?</label><textarea id="ciDecision" rows="1"></textarea>
      <label for="ciNext">What happens before the next check-in?</label><textarea id="ciNext" rows="1"></textarea>
      <div class="actions" style="margin-top:10px"><button class="btn btn-gold" type="button" id="ciSave">Save check-in</button> <span id="ciMsg"></span></div>
    </div>
    ${recent ? `<h3 style="margin-top:18px">Recent check-ins</h3>${recent}` : ''}
  </section>`;
}
// Sample workspace (report.html?demo=sample): a fictional organization
// loaded from sample-portal.json for the website's product tour. Nothing
// is sent to the server and nothing is saved.
const DEMO = new URLSearchParams(location.search).get('demo') === 'sample';
async function portalPost(path, body) {
  if (DEMO) throw new Error('This is a sample workspace, so changes aren\u2019t saved. In your own portal, this goes straight to Franklin.');
  const res = await fetch(API_BASE + '/public/portal/' + encodeURIComponent(PORTAL_TOKEN) + path, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Could not save. Try again in a minute.');
  return data;
}
function refreshPlan(bundle) {
  const holder = { improvement: bundle };
  const na = document.getElementById('nextAction'), pl = document.getElementById('plan');
  if (na) na.outerHTML = nextActionHtml(holder);
  if (pl) pl.outerHTML = planHtml(holder);
}
document.addEventListener('change', async (e) => {
  if (!e.target.classList.contains('act-status')) return;
  const row = e.target.closest('.plan-act'); const msg = document.getElementById('actMsg');
  msg.textContent = 'Saving...';
  try { refreshPlan(await portalPost('/actions/' + row.dataset.id, { status: e.target.value })); const m = document.getElementById('actMsg'); if (m) m.textContent = 'Saved.'; }
  catch (err) { msg.textContent = err.message; }
});
document.addEventListener('click', async (e) => {
  if (e.target.id !== 'ciSave') return;
  const v = (id) => document.getElementById(id).value.trim();
  const msg = document.getElementById('ciMsg');
  const body = { completed: v('ciDone'), blocked: v('ciBlocked'), evidenceAdded: v('ciEvidence'), decisionNeeded: v('ciDecision'), nextSteps: v('ciNext') };
  if (!Object.values(body).some(Boolean)) { msg.className = 'err'; msg.textContent = 'Add at least one answer.'; return; }
  e.target.disabled = true; msg.className = ''; msg.textContent = 'Saving...';
  try { refreshPlan(await portalPost('/checkin', body)); const m = document.getElementById('ciMsg'); if (m) { m.className = 'ok'; m.textContent = 'Check-in saved. Thank you.'; } }
  catch (err) { msg.className = 'err'; msg.textContent = err.message; e.target.disabled = false; }
});

function recordHtml(p) {
  const r = (p && p.record) || {};
  if (!r.presentingProblem && !r.verifiedConstraint) return '';
  return `<section class="card">
    <h2>What we found</h2>
    <div class="next-grid">
      ${r.presentingProblem ? `<div><h3>What you told us</h3><p>${esc(r.presentingProblem)}</p></div>` : ''}
      ${r.verifiedConstraint ? `<div><h3>What the evidence showed</h3><p>${esc(r.verifiedConstraint)}</p></div>` : ''}
      ${r.nextInLine ? `<div><h3>Next in line</h3><p>${esc(r.nextInLine)}</p></div>` : ''}
    </div>
  </section>`;
}

function selfVsHtml(p, r) {
  const self = (p && p.selfScores) || {};
  const perc = (p && p.perception) || {};
  const lead = perc.dimensions || {};
  const dims = (r && r.dimensions) || [];
  const hasLead = Object.keys(lead).length > 0;
  if ((!Object.keys(self).length && !hasLead) || !dims.length) return '';
  const rows = dims.map((d) => {
    const key = DIM_KEYS[d.name] === 'financial' ? 'revenue' : DIM_KEYS[d.name];
    const L = lead[key];
    const sv = hasLead && L ? L.avg : self[key];
    if (typeof sv !== 'number') return '';
    const gap = Math.round(sv - d.score);
    const label = hasLead && L ? `leaders said ${L.avg}${L.n > 1 ? ` (${L.min}–${L.max})` : ''}` : `you said ${sv}`;
    const note = Math.abs(gap) >= 20 ? 'Your view and the evidence differ' : 'Close to the evidence';
    const split = hasLead && L && L.n > 1 && L.max - L.min >= 40 ? ' · leaders disagree' : '';
    return `<div class="dim"><div class="name">${esc(d.name)}<small>${note}${split}</small></div>
      <div class="track" role="img" aria-label="${esc(d.name)}: ${label}, evidence shows ${r0(d.score)}">
        <div class="fill" style="width:${Math.max(2, Math.min(100, d.score))}%"></div>
        <div class="tick" style="left:calc(${Math.min(100, sv)}% - 1px);background:var(--gold)"></div>
      </div>
      <div class="nums"><b>${r0(d.score)}</b><small>${label}</small></div></div>`;
  }).join('');
  if (!rows) return '';
  return `<section class="card"><h2>Your view and the evidence</h2>
    <p class="lead">The bar is the verified score; the gold mark is what ${hasLead ? `your leadership team said (${perc.respondents} ${perc.respondents === 1 ? 'response' : 'responses'})` : 'your self-assessment said'}. The biggest gaps usually point to the real constraint.</p>${rows}</section>`;
}

function closeoutHtml(p) {
  const c = ((p && p.record) || {}).closeout || {};
  const res = c.results || {}, std = c.standardize || {};
  const rows = [['What changed', c.changes], ['Evidence created', c.evidence], ['Remaining risks', c.risks], ['Who owns it now', c.owner], ['Reassessment', c.reassessOn ? fmtDate(c.reassessOn) : ''], ['When to call us again', c.callAgain],
    ['What was done', res.activity], ['What people can now do', res.capability], ['What changed in the organization', res.institutional], ['What changed for the people you serve', res.mission]]
    .filter(([, v]) => v);
  const stdItems = [['documented', 'Written down'], ['owner', 'Has a named owner'], ['usedConsistently', 'Used consistently'], ['trained', 'New staff trained in it'], ['measured', 'Performance measured']];
  const stdAny = stdItems.some(([k]) => std[k] === true);
  if (!rows.length && !stdAny) return '';
  return `<section class="card"><h2>Engagement closeout</h2>
    ${rows.map(([k, v]) => `<div class="item"><div><strong>${esc(k)}</strong><div>${esc(v)}</div></div></div>`).join('')}
    ${stdAny ? `<h3 style="margin-top:14px">Is it now standard practice?</h3>${stdItems.map(([k, l]) => `<div class="item"><div>${esc(l)}</div><span class="pill ${std[k] === true ? 'green' : 'grey'}">${std[k] === true ? 'Yes' : 'Not yet'}</span></div>`).join('')}` : ''}</section>`;
}

function funderNoteHtml() {
  return `<section class="card"><h2>About this report</h2><p style="margin:0">InstitutionalOS scores an organization on seven dimensions using evidence, not self-description: filed Form 990 data where available, and documents reviewed by Frankly Inspired and Associates. <a href="${SITE}/methodology" target="_blank" rel="noopener">How scoring works</a>.</p></section>`;
}

function nextHtml() {
  return `<section class="card no-print">
    <h2>What happens next</h2>
    <div class="next-grid">
      <div><h3>Talk it through</h3><p>A 30-minute call to agree on the first move against your binding constraint.</p><a class="btn btn-gold" href="${CALENDLY}" target="_blank" rel="noopener">Schedule a call</a></div>
      <div><h3>Update your self-check</h3><p>Retake the free tools to keep your Health Index current between diagnostics.</p><a class="btn btn-ghost" href="${SITE}/health-index">Open your Health Index</a></div>
      <div><h3>Keep a copy</h3><p>Save or print this page to share with your board.</p><div class="actions"><button class="btn btn-ghost" type="button" onclick="window.print()">Print or save PDF</button></div></div>
    </div>
  </section>`;
}

async function load() {
  const app = document.getElementById('app');
  const params = new URLSearchParams(location.search);
  const client = params.get('demo') === 'sample' ? 'sample' : params.get('client');
  const token = client || params.get('token');
  if (!token) {
    app.innerHTML = '<div class="wrap state"><h1>Report link needed</h1><p class="muted">Open the private link Franklin sent you. If you can’t find it, email <a href="mailto:franklin@franklyinspired.associates">franklin@franklyinspired.associates</a>.</p></div>';
    return;
  }
  try {
    const d = await fetchReport(token, !!client);
    document.title = d.org.name + (DEMO_MODE() ? ' | Sample Workspace' : client ? ' | Client Portal' : ' | InstitutionalOS Report');
    PORTAL_TOKEN = client || '';
    ORG_NAME = d.org.name;
    if (client && params.get('view') === 'board') {
      document.title = d.org.name + ' | Board Report';
      document.body.classList.add('board-view');
      app.innerHTML = (DEMO_MODE() ? '<div class="demo-bar no-print" role="note">Sample workspace: a fictional organization with sample data.</div>' : '') + boardHtml(d);
      return;
    }
    if (client) {
      const R = d.readiness || {};
      const docs = d.portal && d.portal.documentsUrl ? `<section class="card"><h2>Your documents</h2><p>Plans, memos, and working files we share, in one folder.</p><a class="btn btn-ghost" href="${esc(d.portal.documentsUrl)}" target="_blank" rel="noopener">Open your folder</a></section>` : '';
      const panels = {
        home: nextActionHtml(d.portal) + contextHtml(d.portal) + sessionHtml(d.portal) + boardLinkHtml() + nextHtml(),
        health: comparisonHtml((d.portal || {}).comparison) + dimsHtml(R) + selfVsHtml(d.portal, R) + historyHtml(d.history) + sealHtml(R.candidSeal) + boardLinkHtml(),
        priority: constraintHtml(R) + recordHtml(d.portal),
        plan: planHtml(d.portal) + updatesHtml(d.updates),
        evidence: evidenceHtml(d.evidence, R) + docs + closeoutHtml(d.portal) + outcomesHtml(d.outcomes) + complianceHtml(d.compliance) + donorHtml(d.donorSustainability),
      };
      const names = { home: 'Home', health: 'Health', priority: 'Priority', plan: '90-Day Plan', evidence: 'Evidence' };
      app.innerHTML = (DEMO_MODE() ? '<div class="demo-bar" role="note">Sample workspace: a fictional organization with sample data, so you can see how InstitutionalOS works. <a href="https://franklyinspired.associates/assessment">Start your own free check-up</a></div>' : '') + heroHtml(d) + `<nav class="tabs no-print" aria-label="Portal sections"><div class="wrap" role="tablist">${Object.keys(names).map(k => `<button type="button" role="tab" id="tab-${k}" aria-controls="panel-${k}" data-tab="${k}">${names[k]}</button>`).join('')}</div></nav>` +
        '<main><div class="wrap">' + Object.keys(panels).map(k => `<div class="tab-panel" role="tabpanel" id="panel-${k}" aria-labelledby="tab-${k}">${panels[k] || '<section class="card"><p class="muted" style="margin:0">Nothing here yet.</p></section>'}</div>`).join('') + '</div></main>';
      const show = (k, focus) => {
        if (!names[k]) k = 'home';
        document.querySelectorAll('.tabs button').forEach(b => { const on = b.dataset.tab === k; b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1; if (on && focus) b.focus(); });
        document.querySelectorAll('.tab-panel').forEach(p => { p.hidden = p.id !== 'panel-' + k; });
        if (location.hash.slice(1) !== k) history.replaceState(null, '', location.pathname + location.search + '#' + k);
      };
      const tabs = document.querySelector('.tabs');
      tabs.addEventListener('click', (e) => { const b = e.target.closest('button[data-tab]'); if (b) { show(b.dataset.tab); window.scrollTo({ top: tabs.offsetTop, behavior: 'smooth' }); } });
      tabs.addEventListener('keydown', (e) => {
        if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
        const keys = Object.keys(names), cur = keys.indexOf(document.querySelector('.tabs button[aria-selected="true"]').dataset.tab);
        show(keys[(cur + (e.key === 'ArrowRight' ? 1 : keys.length - 1)) % keys.length], true);
      });
      document.addEventListener('click', (e) => { const a = e.target.closest('a[href^="#"]'); if (a && names[a.getAttribute('href').slice(1)]) { e.preventDefault(); show(a.getAttribute('href').slice(1)); } });
      show(location.hash.slice(1) || 'home');
      wireDial();
    } else {
      app.innerHTML = heroHtml(d) + '<main><div class="wrap">' +
        constraintHtml(d.readiness || {}) + dimsHtml(d.readiness || {}) + historyHtml(d.history) +
        sealHtml((d.readiness || {}).candidSeal) + complianceHtml(d.compliance) + donorHtml(d.donorSustainability) + funderNoteHtml() +
        '</div></main>';
      wireDial();
    }
  } catch (e) {
    app.innerHTML = '<div class="wrap state"><h1>We couldn’t open this report</h1><p class="error">' + esc(e.message) + '</p><p class="muted">Email <a href="mailto:franklin@franklyinspired.associates">franklin@franklyinspired.associates</a> and he’ll send a fresh link.</p></div>';
  }
}
load();
</script>
