# Render Blueprint - https://render.com/docs/blueprint-spec
# Deploys this backend as a Docker web service. Storage is Postgres (Neon)
# via DATABASE_URL, not a local disk - Render's free-tier filesystem is
# ephemeral on every deploy/restart, which is exactly what moved this off
# SQLite (see db.py).
services:
  - type: web
    name: grantpass-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: GRANTPASS_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 8420
